# GPT-6 Astra Concept 的产品要求事实源。
# 产品测试从这里读语言清单（code/tests/common.py::languages），改语言先改这里，再改 translations.csv 的列。
程序化支持多语言:
  支持英语、汉语、日语、西班牙语、德语、法语，但需要先定义好文案的Token。而不是硬编码，使用与平台相关的多元技术方案。涉及跨平台的，需要先使用与平台无关的表，维护好多语言翻译:
    - en
    - zh-Hans
    - ja
    - es
    - de
    - fr
  创建可复用的文字翻译映射表,表第一列为Token，后面几列为支持的语言及对应的翻译: {}
软件架构:
  同一个项目中的不同页面，或者是不同的Tab用户点击之后要更新URL，避免刷新之后状态丢失: {}

产品要求:
  一句话定义: 一个收录经典 UI 交互与 Logo 的网站，但收录的不是图标本身，而是把它的设计拆解成数学表达。
  为什么做: |
    设计圈的「拆解」大多停在「参考了黄金分割」这种口号上，看完仍然做不出来。
    本站的判据是：读者读完能照着公式把它复现出来。
    因此每条收录必须交出可执行的数学——参数、公式、取值范围，而不是形容词。
  收录对象:
    经典 UI 交互: {}
    经典 Logo: {}
  展示形式:
    说明: 一条收录只有一种形式：可交互网页本身。画面当场算，不预先渲染成图片 / GIF / 视频。
    形式清单:
      - webpage    # 独立可交互网页：改参数即时看到公式如何驱动画面
    要求: 画面必须由 entries.json 里那一组参数驱动，参数只存一份，否则「拆解」就成了各说各的
  每条收录必须包含:
    数学表达: 公式 + 每个参数的含义、取值与默认值
    设计语言: 这套数学在设计上意味着什么——版式、色彩、运动、节奏的口径
    出处与考据: 说清哪些是原作者公开的、哪些是本站的逆向重建，不许把重建说成史实
  站点只有两个页面:
    首页就是全屏 Demo: 站点根路径直接落到全屏 Demo；拖滑块改参数，推导量实时重算
    复位放在右侧参数面板里: 复位在面板底部，底部工具条只留说明页入口、提示与面板开关
    参数面板默认收起: 各端一致默认收起，画面右上角一个按钮呼出；展开才写进 URL
    语言选择器常驻右上角: 六种语言 en / zh-Hans / ja / es / de / fr，与面板按钮并排
    默认语言英语: 不猜浏览器语言；顺序 URL 的 lang > 访客上次的选择 > en
    手机适配: ≤720px 时面板改为贴底通栏；画布 touch-action 关掉，拖动是倾斜星场而不是滚页面
    说明页 /about: 为什么做这个、GPT-6 简介、指向 https://openai.com/index/gpt-6-astra/ 的链接与出处考据
  首批一条:
    gpt-6-astra:
      对象: OpenAI GPT-6 Astra 发布页的星系粒子动效与交互
      参考: https://openai.com/index/gpt-6-astra/
  语言: 站点文案全部走一张 Token 表，六种语言：en / zh-Hans / ja / es / de / fr
